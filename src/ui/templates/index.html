<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quantum Network Simulator</title>

  <link rel="stylesheet" href="static/styles/styles.css" />

  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
</head>

<body>
  <div id="app">

    <!-- Left sidebar -->
    <aside id="sidebar">
      <h2>Logs</h2>
      <div id="logs"></div>
    </aside>

    <!-- Graph -->
    <main id="main">
      <div id="graph"></div>

      <!-- LEGEND (NEW) -->
      <div id="legend">
        <div class="legend-item">
          <span class="dot client"></span>
          Client Node
        </div>
        <div class="legend-item">
          <span class="dot epr"></span>
          EPR Node
        </div>
      </div>
    </main>

    <!-- Right panel -->
    <aside id="node-panel">
      <h2>Inspector</h2>

      <!-- Node section -->
      <div id="node-section">
        <h3>Node</h3>
        <div class="field" id="field-node-id">
          <strong>Temp ID:</strong>
          <span id="node-temp-id">-</span>
        </div>
        <div class="field" id="field-node-type">
          <label>
            Type:
            <select id="node-type-input">
              <option value="0">ClientNode</option>
              <option value="1">EprNode</option>
            </select>
          </label>
        </div>
      </div>

      <hr />

      <!-- Link section -->
      <div id="link-section">
        <h3>Link</h3>
        <div class="field" id="field-link-from">
          <strong>From:</strong>
          <span id="link-from">-</span>
        </div>
        <div class="field" id="field-link-to">
          <strong>To:</strong>
          <span id="link-to">-</span>
        </div>
        <div class="field" id="field-link-distance">
          <label>
            Distance:
            <input id="link-distance-input" type="number" />
          </label>
        </div>
        <div class="field" id="field-link-secure">
          <label>
            Secure:
            <input id="link-secure-input" type="checkbox" />
          </label>
        </div>
      </div>

      <button id="save-btn">Save</button>
      <button id="close-panel">Close</button>
    </aside>
  </div>

  <script src="static/js/js-requests.js"></script>
  <script src="static/js/js-handlers.js"></script>
  <script src="static/js/js-cytoscape.js"></script>
</body>
</html>
